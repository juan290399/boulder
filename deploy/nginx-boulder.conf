# Proxy inverso con HTTPS delante del jar (Spring Boot escucha en 127.0.0.1:8080).
# Certificado con certbot: sudo certbot --nginx -d boulder.ejemplo.pe
server {
    listen 80;
    server_name boulder.ejemplo.pe;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name boulder.ejemplo.pe;

    ssl_certificate     /etc/letsencrypt/live/boulder.ejemplo.pe/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/boulder.ejemplo.pe/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Fotos de testigo y plantillas Excel: hasta 25 MB, igual que Spring.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Avisos en tiempo real (SSE): sin búfer y con conexión larga.
    location /api/eventos {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # Las métricas no salen a internet; se consultan desde el propio servidor.
    location /actuator/metrics { deny all; }
}
