<div class="page">
  <div class="page-head">
    <h1 class="page-head__title">Roles</h1>
  </div>

  <div *ngIf="error" class="alert-inline">{{ error }}</div>

  <section class="panel">
    <div class="panel__head">
      <h2 class="panel__title">Roles del sistema</h2>
      <span class="text-secondary small">Se asignan a cada cuenta desde Usuarios</span>
    </div>

    <div class="table-scroll" *ngIf="roles.length > 0; else vacio">
      <table class="data-table">
        <thead>
          <tr>
            <th>Código</th>
            <th>Nombre</th>
            <th class="num">Cuentas activas</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let r of roles">
            <td class="mono">{{ r.codigo }}</td>
            <td>{{ r.nombre }}</td>
            <td class="num">{{ cuentasPorRol[r.codigo] ?? 0 }}</td>
          </tr>
        </tbody>
      </table>
    </div>

    <ng-template #vacio>
      <div class="empty-state">
        <span *ngIf="loading">Cargando roles…</span>
        <span *ngIf="!loading">No hay roles registrados.</span>
      </div>
    </ng-template>
  </section>
</div>
