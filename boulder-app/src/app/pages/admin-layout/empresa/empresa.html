<div class="page">
  <div class="page-head">
    <h1 class="page-head__title">Empresas</h1>
  </div>

  <section class="panel">
    <div class="panel__head">
      <h2 class="panel__title">{{ form.id ? 'Editar empresa' : 'Nueva empresa' }}</h2>
    </div>
    <div class="panel__body">
      <div class="row g-3 mb-3">
        <div class="col-md-2">
          <label for="emp-codigo" class="form-label">Código</label>
          <input id="emp-codigo" class="form-control" [(ngModel)]="form.codigo" />
        </div>
        <div class="col-md-4">
          <label for="emp-nombre" class="form-label">Razón social</label>
          <input id="emp-nombre" class="form-control" [(ngModel)]="form.nombre" />
        </div>
        <div class="col-md-2">
          <label for="emp-ruc" class="form-label">RUC</label>
          <input id="emp-ruc" class="form-control" inputmode="numeric" [(ngModel)]="form.ruc" />
        </div>
        <div class="col-md-4">
          <label for="emp-direccion" class="form-label">Dirección</label>
          <input id="emp-direccion" class="form-control" [(ngModel)]="form.direccion" />
        </div>
        <div class="col-md-3">
          <label for="emp-telefono" class="form-label">Teléfono</label>
          <input id="emp-telefono" class="form-control" type="tel" [(ngModel)]="form.telefono" />
        </div>
        <div class="col-md-4">
          <label for="emp-correo" class="form-label">Correo</label>
          <input id="emp-correo" class="form-control" type="email" [(ngModel)]="form.correo" />
        </div>
      </div>

      <div class="d-flex gap-2">
        <button type="button" class="btn btn-success" (click)="guardar()">
          {{ form.id ? 'Guardar cambios' : 'Crear empresa' }}
        </button>
        <button type="button" class="btn btn-outline-secondary" (click)="limpiar()">
          {{ form.id ? 'Cancelar' : 'Limpiar' }}
        </button>
      </div>

      <div *ngIf="mensaje" class="alert-inline alert-inline--info mt-3 mb-0">{{ mensaje }}</div>
    </div>
  </section>

  <section class="panel">
    <div class="panel__head">
      <h2 class="panel__title">Empresas registradas</h2>
      <button type="button" class="btn btn-sm btn-outline-secondary" [disabled]="loading" (click)="listar()">
        <i class="bi bi-arrow-clockwise me-1"></i>Refrescar
      </button>
    </div>
    <div class="panel__body">
      <div class="row g-2">
        <div class="col-md-6">
          <label for="emp-buscar-ruc" class="form-label">Buscar por RUC</label>
          <div class="input-group">
            <input id="emp-buscar-ruc" class="form-control" inputmode="numeric" [(ngModel)]="busquedaRuc"
                   (keyup.enter)="buscarPorRuc()" />
            <button type="button" class="btn btn-primary" (click)="buscarPorRuc()">Buscar</button>
          </div>
        </div>
        <div class="col-md-6">
          <label for="emp-buscar-id" class="form-label">Buscar por ID</label>
          <div class="input-group">
            <input id="emp-buscar-id" class="form-control" [(ngModel)]="busquedaId" (keyup.enter)="buscarPorId()" />
            <button type="button" class="btn btn-outline-primary" (click)="buscarPorId()">Buscar</button>
          </div>
        </div>
      </div>
    </div>

    <div class="table-scroll" *ngIf="empresas.length > 0; else vacio">
      <table class="data-table">
        <thead>
          <tr>
            <th>Código</th><th>Razón social</th><th>RUC</th><th>Dirección</th><th><span class="visually-hidden">Acciones</span></th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let e of empresas">
            <td class="mono">{{ e.codigo }}</td>
            <td>{{ e.nombre }}</td>
            <td class="num">{{ e.ruc || '—' }}</td>
            <td>{{ e.direccion || '—' }}</td>
            <td class="text-end">
              <button type="button" class="btn btn-sm btn-outline-primary" (click)="editar(e)">Editar</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <ng-template #vacio>
      <div class="empty-state">No hay empresas para mostrar.</div>
    </ng-template>
  </section>
</div>
