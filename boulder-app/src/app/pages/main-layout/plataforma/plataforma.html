<div class="page">
  <div class="panel panel__body">
    <h1 class="page-head__title mb-4">Plataformas de Perforación</h1>

    <div class="row g-2 mb-3">
      <div class="col-md-2">
        <input class="form-control" placeholder="Código" [(ngModel)]="form.codigo" />
      </div>
      <div class="col-md-3">
        <input class="form-control" placeholder="Nombre" [(ngModel)]="form.nombre" />
      </div>
      <div class="col-md-4">
        <select class="form-select" [(ngModel)]="form.proyectoId">
          <option [ngValue]="''">— Proyecto —</option>
          <option *ngFor="let p of proyectos" [ngValue]="p.id">{{ p.nombre }}</option>
        </select>
      </div>
      <div class="col-md-3">
        <input class="form-control" placeholder="Tipo" [(ngModel)]="form.tipo" />
      </div>
    </div>

    <div class="row g-2 mb-3">
      <div class="col-md-3">
        <input class="form-control" type="number" placeholder="Este" [(ngModel)]="form.este" />
      </div>
      <div class="col-md-3">
        <input class="form-control" type="number" placeholder="Norte" [(ngModel)]="form.norte" />
      </div>
      <div class="col-md-3">
        <input class="form-control" type="number" placeholder="Elevación" [(ngModel)]="form.elevacion" />
      </div>
      <div class="col-md-3">
        <input class="form-control" type="number" placeholder="N° pozas" [(ngModel)]="form.numeroPozas" />
      </div>
    </div>

    <div class="row g-2 mb-3">
      <div class="col-md-3">
        <input class="form-control" placeholder="Estado" [(ngModel)]="form.estado" />
      </div>
      <div class="col-md-9">
        <input class="form-control" placeholder="Ubicación" [(ngModel)]="form.ubicacion" />
      </div>
    </div>

    <div class="mb-4">
      <button class="btn btn-success me-2" (click)="guardar()">
        {{ form.id ? 'Actualizar' : 'Crear' }}
      </button>
      <button class="btn btn-secondary" (click)="limpiar()">Limpiar</button>
    </div>

    <div *ngIf="mensaje" class="alert-inline alert-inline--info">{{ mensaje }}</div>

    <hr class="my-3" />

    <div class="row g-2 mb-3">
      <div class="col-md-6">
        <div class="input-group">
          <input class="form-control" placeholder="Buscar por código" [(ngModel)]="busquedaCodigo" />
          <button class="btn btn-primary" (click)="buscarPorCodigo()">Buscar</button>
        </div>
      </div>
      <div class="col-md-6">
        <div class="input-group">
          <input class="form-control" placeholder="Buscar por ID" [(ngModel)]="busquedaId" />
          <button class="btn btn-primary" (click)="buscarPorId()">Buscar</button>
        </div>
      </div>
    </div>

    <button class="btn btn-outline-primary mb-3" [disabled]="loading" (click)="listar()">
      Refrescar listado
    </button>

    <div class="table-scroll" *ngIf="plataformas.length > 0; else vacio">
      <table class="data-table">
        <thead>
          <tr><th>Código</th><th>Nombre</th><th>Proyecto</th><th>Este</th><th>Norte</th><th>Elev.</th><th>Estado</th><th></th></tr>
        </thead>
        <tbody>
          <tr *ngFor="let pl of plataformas">
            <td>{{ pl.codigo }}</td>
            <td>{{ pl.nombre }}</td>
            <td>{{ nombreProyecto(pl.proyectoId) }}</td>
            <td>{{ pl.este ?? '—' }}</td>
            <td>{{ pl.norte ?? '—' }}</td>
            <td>{{ pl.elevacion ?? '—' }}</td>
            <td><span class="badge bg-secondary">{{ pl.estado || '—' }}</span></td>
            <td class="text-end">
              <button class="btn btn-sm btn-outline-primary" (click)="editar(pl)">Editar</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <ng-template #vacio>
      <div class="empty-state">No hay plataformas para mostrar.</div>
    </ng-template>
  </div>
</div>
