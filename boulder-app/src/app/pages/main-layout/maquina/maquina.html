<div class="page">
  <div class="panel panel__body">
    <h1 class="page-head__title mb-4">Máquinas de Perforación</h1>

    <div class="row g-2 mb-3">
      <div class="col-md-2">
        <input class="form-control" placeholder="Código" [(ngModel)]="form.codigo" />
      </div>
      <div class="col-md-3">
        <input class="form-control" placeholder="Nombre" [(ngModel)]="form.nombre" />
      </div>
      <div class="col-md-2">
        <input class="form-control" placeholder="Tipo" [(ngModel)]="form.tipo" />
      </div>
      <div class="col-md-2">
        <input class="form-control" placeholder="Marca" [(ngModel)]="form.marca" />
      </div>
      <div class="col-md-3">
        <input class="form-control" placeholder="Motor" [(ngModel)]="form.motor" />
      </div>
    </div>

    <div class="row g-2 mb-3">
      <div class="col-md-3">
        <input class="form-control" type="number" placeholder="Alcance PQ" [(ngModel)]="form.alcancePq" />
      </div>
      <div class="col-md-3">
        <input class="form-control" type="number" placeholder="Alcance HQ" [(ngModel)]="form.alcanceHq" />
      </div>
      <div class="col-md-3">
        <input class="form-control" type="number" placeholder="Alcance NQ" [(ngModel)]="form.alcanceNq" />
      </div>
      <div class="col-md-3">
        <input class="form-control" placeholder="Estado" [(ngModel)]="form.estado" />
      </div>
    </div>

    <div class="mb-4">
      <button class="btn btn-success me-2" (click)="guardar()">
        {{ form.id ? 'Actualizar' : 'Crear' }}
      </button>
      <button class="btn btn-secondary" (click)="limpiar()">Limpiar</button>
    </div>

    <div *ngIf="mensaje" class="alert-inline alert-inline--info">{{ mensaje }}</div>

    <hr class="my-3" />

    <div class="row g-2 mb-3">
      <div class="col-md-6">
        <div class="input-group">
          <input class="form-control" placeholder="Buscar por código" [(ngModel)]="busquedaCodigo" />
          <button class="btn btn-primary" (click)="buscarPorCodigo()">Buscar</button>
        </div>
      </div>
      <div class="col-md-6">
        <div class="input-group">
          <input class="form-control" placeholder="Buscar por ID" [(ngModel)]="busquedaId" />
          <button class="btn btn-primary" (click)="buscarPorId()">Buscar</button>
        </div>
      </div>
    </div>

    <button class="btn btn-outline-primary mb-3" [disabled]="loading" (click)="listar()">
      Refrescar listado
    </button>

    <div class="row" *ngIf="maquinas.length > 0; else vacio">
      <div class="col-md-4 mb-3" *ngFor="let m of maquinas">
        <div class="panel panel__body h-100">
          <div class="card-body">
            <h5 class="card-title fw-bold">{{ m.nombre }}</h5>
            <p class="mb-1"><b>Código:</b> {{ m.codigo }}</p>
            <p class="mb-1"><b>Tipo:</b> {{ m.tipo || '—' }}</p>
            <p class="mb-1"><b>Marca:</b> {{ m.marca || '—' }}</p>
            <p class="mb-2"><b>Alcance:</b> PQ {{ m.alcancePq || '—' }} / HQ {{ m.alcanceHq || '—' }} / NQ {{ m.alcanceNq || '—' }}</p>
            <span class="badge bg-secondary">{{ m.estado }}</span>
            <button class="btn btn-sm btn-outline-primary mt-3 w-100" (click)="editar(m)">Editar</button>
          </div>
        </div>
      </div>
    </div>

    <ng-template #vacio>
      <div class="empty-state">No hay máquinas para mostrar.</div>
    </ng-template>
  </div>
</div>
