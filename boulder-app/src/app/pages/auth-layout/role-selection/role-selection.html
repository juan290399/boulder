<div class="container-fluid p-0">
  <h2 class="text-center mb-1">Selecciona tu rol</h2>
  <p class="subtitle text-center mb-4">Elige el entorno de trabajo para esta sesión</p>

  <div *ngIf="roles.length > 0; else sinRoles">
    <div class="form-group mb-3">
      <label for="roleSelect" class="form-label fw-semibold text-secondary">Rol disponible:</label>
      <select class="form-select custom-select" [(ngModel)]="selectedRole" id="roleSelect">
        <option [ngValue]="null" disabled>-- Elige un rol --</option>
        <option [ngValue]="role" *ngFor="let role of roles">{{ etiqueta(role) }}</option>
      </select>
    </div>

    <button class="btn-primary-auth w-100 mt-2" (click)="onRoleSelected()" [disabled]="!selectedRole">
      Continuar
    </button>
  </div>

  <ng-template #sinRoles>
    <div class="alert alert-warning-custom text-center p-3 mt-2">
      <span class="alert-icon">⚠️</span>
      <p class="mb-0 fw-medium">
        Tu cuenta no tiene roles asignados. Contacta al administrador del sistema.
      </p>
    </div>

    <button class="btn-primary-auth w-100 mt-3" (click)="volverAlLogin()">
      Volver al inicio de sesión
    </button>
  </ng-template>
</div>
