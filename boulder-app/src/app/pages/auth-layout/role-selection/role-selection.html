<h1 class="auth-title">Elige tu rol</h1>
<p class="auth-sub">Tu cuenta tiene más de un rol. Elige con cuál trabajar en esta sesión.</p>

<div *ngIf="roles.length > 0; else sinRoles">
  <div class="mb-3">
    <label for="roleSelect" class="form-label">Rol</label>
    <select class="form-select" [(ngModel)]="selectedRole" id="roleSelect">
      <option [ngValue]="null" disabled>Elige un rol</option>
      <option [ngValue]="role" *ngFor="let role of roles">{{ etiqueta(role) }}</option>
    </select>
  </div>

  <button type="button" class="btn btn-primary w-100" (click)="onRoleSelected()" [disabled]="!selectedRole">
    Continuar
  </button>
</div>

<ng-template #sinRoles>
  <div class="alert alert-warning py-2 small" role="alert">
    <i class="bi bi-exclamation-triangle me-1"></i>
    Tu cuenta todavía no tiene roles. Pide al administrador que te asigne uno.
  </div>

  <button type="button" class="btn btn-outline-secondary w-100" (click)="volverAlLogin()">
    Volver al inicio de sesión
  </button>
</ng-template>
