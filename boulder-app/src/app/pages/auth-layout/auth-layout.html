<div class="auth-shell">
  <!-- Ilustración lateral: un corte geológico con tres sondajes inclinados que
       cruzan un cuerpo mineralizado. Se oculta en pantallas angostas. -->
  <aside class="auth-art" aria-hidden="true">
    <svg class="auth-art__svg" viewBox="0 0 520 520" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <clipPath id="corte">
          <rect x="20" y="20" width="480" height="480" rx="28" />
        </clipPath>
        <pattern id="testigo" width="14" height="14" patternUnits="userSpaceOnUse">
          <rect width="14" height="14" fill="#f8fafc" />
          <path d="M0 7h14" stroke="#cbd5e1" stroke-width="1" />
        </pattern>
      </defs>

      <g clip-path="url(#corte)">
        <!-- cielo -->
        <rect x="20" y="20" width="480" height="480" fill="#f8fafc" />

        <!-- estratos, del más somero al más profundo -->
        <path d="M20 170 C110 150 200 182 290 166 S430 150 500 160 V500 H20 Z" fill="#dbe5f6" />
        <path d="M20 232 C120 214 220 250 320 230 S450 214 500 222 V500 H20 Z" fill="#c7d6f1" />
        <path d="M20 300 C130 282 230 322 330 300 S450 286 500 292 V500 H20 Z" fill="#b2c6eb" />
        <path d="M20 372 C140 352 240 392 340 370 S450 356 500 362 V500 H20 Z" fill="#9db5e4" />
        <path d="M20 440 C150 422 250 458 350 438 S450 426 500 432 V500 H20 Z" fill="#88a4dd" />

        <!-- cuerpo mineralizado -->
        <path d="M232 318 C268 292 336 290 380 310 C412 326 404 352 370 362 C326 376 262 372 236 354 C216 340 214 330 232 318 Z"
              fill="#fde68a" stroke="#d97706" stroke-width="1.5" />
        <path d="M262 334 C292 320 338 320 364 332" fill="none" stroke="#d97706" stroke-width="1" stroke-dasharray="3 4" opacity=".7" />

        <!-- superficie -->
        <path d="M20 170 C110 150 200 182 290 166 S430 150 500 160" fill="none" stroke="#475569" stroke-width="1.5" />

        <!-- sondajes: traza con estaciones de medición -->
        <g fill="none" stroke="#1d4ed8" stroke-width="2.5" stroke-linecap="round">
          <path d="M168 168 L246 330 L278 400" />
          <path d="M252 170 L300 338 L316 424" />
          <path d="M352 158 L330 300 L318 372" />
        </g>
        <g fill="#ffffff" stroke="#1d4ed8" stroke-width="2">
          <circle cx="207" cy="249" r="4" /><circle cx="246" cy="330" r="4" /><circle cx="278" cy="400" r="4" />
          <circle cx="276" cy="254" r="4" /><circle cx="300" cy="338" r="4" /><circle cx="316" cy="424" r="4" />
          <circle cx="341" cy="229" r="4" /><circle cx="330" cy="300" r="4" /><circle cx="318" cy="372" r="4" />
        </g>

        <!-- collares -->
        <g fill="#2563eb">
          <rect x="161" y="160" width="14" height="10" rx="2" />
          <rect x="245" y="162" width="14" height="10" rx="2" />
          <rect x="345" y="150" width="14" height="10" rx="2" />
        </g>

        <!-- máquina perforadora sobre el sondaje del medio -->
        <g stroke="#0f172a" stroke-width="2" stroke-linejoin="round" fill="none">
          <path d="M252 162 L240 78 L264 78 Z" fill="#ffffff" />
          <path d="M244 110 H260 M242 94 H262 M246 126 H258" />
          <rect x="226" y="150" width="52" height="12" rx="3" fill="#0f172a" />
          <path d="M252 78 V64" />
        </g>
        <circle cx="252" cy="62" r="3" fill="#d97706" />

        <!-- caja de testigos -->
        <g transform="translate(372 66)">
          <rect width="104" height="62" rx="8" fill="url(#testigo)" stroke="#94a3b8" stroke-width="1.5" />
          <g stroke-linecap="round" stroke-width="7">
            <path d="M12 14 H70" stroke="#b2c6eb" /><path d="M76 14 H92" stroke="#88a4dd" />
            <path d="M12 31 H40" stroke="#88a4dd" /><path d="M46 31 H92" stroke="#fbbf24" />
            <path d="M12 48 H58" stroke="#fbbf24" /><path d="M64 48 H92" stroke="#c7d6f1" />
          </g>
        </g>
      </g>

      <rect x="20" y="20" width="480" height="480" rx="28" fill="none" stroke="#cbd5e1" stroke-width="1.5" />
    </svg>

    <p class="auth-art__caption">
      Del collar al reporte diario: cada metro perforado se registra una sola vez.
    </p>
  </aside>

  <main class="auth-panel">
    <div class="auth-brand">
      <div class="auth-brand__mark" aria-hidden="true"><app-marca /></div>
      <div>
        <p class="auth-brand__name">Boulder</p>
        <p class="auth-brand__tag">Gestión geológica</p>
      </div>
    </div>

    <router-outlet></router-outlet>

    <p class="auth-foot">Control operativo de sondajes · Campamento VERONICA</p>
  </main>
</div>
