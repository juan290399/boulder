<header class="app-topbar">

  <div class="topbar__context">
    <span class="topbar__eyebrow">Operaciones</span>
    <span class="topbar__area">{{ etiquetaRol }}</span>
  </div>

  <div class="topbar__right">

    <!-- Acceso al panel de administración: solo si el token trae el rol.
         Ocultarlo es comodidad, no seguridad: la puerta real es adminGuard
         en el enrutador y hasRole('ADMIN') en el backend. -->
    <a *ngIf="esAdmin" routerLink="/admin" class="btn btn-sm btn-outline-secondary">
      <i class="bi bi-sliders me-1"></i>
      Administración
    </a>

    <div class="topbar__divider"></div>

    <div class="topbar__user dropdown">
      <button class="topbar__user-btn" type="button"
              data-bs-toggle="dropdown" aria-expanded="false"
              aria-label="Menú de usuario">
        <span class="topbar__avatar">{{ iniciales }}</span>
        <span class="topbar__user-text">
          <span class="topbar__user-name">{{ nombre }}</span>
          <span class="topbar__user-role">{{ etiquetaRol }}</span>
        </span>
        <i class="bi bi-chevron-down"></i>
      </button>

      <ul class="dropdown-menu dropdown-menu-end">
        <li>
          <a class="dropdown-item" routerLink="/mi-cuenta">
            <i class="bi bi-person-gear me-2"></i>Mi cuenta
          </a>
        </li>
        <li>
          <button class="dropdown-item" type="button" (click)="cambiarRol()">
            <i class="bi bi-arrow-repeat me-2"></i>Cambiar de rol
          </button>
        </li>
        <li><hr class="dropdown-divider"></li>
        <li>
          <button class="dropdown-item text-danger" type="button" (click)="cerrarSesion()">
            <i class="bi bi-box-arrow-right me-2"></i>Cerrar sesión
          </button>
        </li>
      </ul>
    </div>

  </div>
</header>
