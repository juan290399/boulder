<aside class="app-sidebar">

  <div class="app-sidebar__brand">
    <div class="app-sidebar__mark">
      <i class="bi bi-gem"></i>
    </div>
    <div>
      <h1 class="app-sidebar__title">Boulder</h1>
      <span class="app-sidebar__subtitle">Gestión geológica</span>
    </div>
  </div>

  <!-- El menú se arma en el componente y no a mano en la plantilla: así el
       orden de las entradas se decide en un solo lugar y agregar una pantalla
       no obliga a tocar el HTML. -->
  <nav class="app-sidebar__nav">
    <ng-container *ngFor="let grupo of grupos">
      <div class="app-sidebar__section">{{ grupo.titulo }}</div>
      <a *ngFor="let item of grupo.items"
         class="app-sidebar__link"
         [routerLink]="item.ruta"
         routerLinkActive="active">
        <i class="bi" [ngClass]="item.icono"></i>
        <span>{{ item.etiqueta }}</span>
      </a>
    </ng-container>
  </nav>

</aside>
