spring.application.name=boulder

# Las credenciales no se versionan. Se leen de variables de entorno
# (DB_PASSWORD, JWT_SECRET) o, en desarrollo, del archivo local ignorado por Git
# application-local.properties (ver application-local.properties.example).
spring.config.import=optional:classpath:application-local.properties

spring.datasource.url=jdbc:postgresql://localhost:5432/boulder_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=2

# validate, NO update. El esquema lo gobiernan los scripts de db/ y tiene vistas
# encima (vw_mm_*, vw_programa_sondaje, vw_desviacion_*). Con `update`, cualquier
# desajuste entre entidad y tabla genera un ALTER que PostgreSQL rechaza si una
# vista depende de la columna; Hikari marca la conexion como rota y la app no
# arranca. Con `validate` el desajuste se reporta claro y nada se modifica solo.
# Al agregar una entidad nueva: escribir su DDL en db/ y aplicarlo.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
# Las plantillas de importacion son libros con catalogos embebidos y pueden
# traer miles de renglones; el limite por defecto de 1 MB deja afuera al
# quicklog completo.
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
