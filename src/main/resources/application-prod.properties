# Perfil de producción: se activa con SPRING_PROFILES_ACTIVE=prod.
# Todo lo que cambia entre servidores sale de variables de entorno.

server.port=${PORT:8080}
server.compression.enabled=true
server.forward-headers-strategy=native

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/boulder_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.hikari.maximum-pool-size=${DB_POOL:10}

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Angular se sirve desde el mismo jar: sin CORS hacia otros orígenes.
boulder.cors.origenes=${BOULDER_CORS_ORIGENES:}

boulder.fotos.directorio=${BOULDER_FOTOS:/var/lib/boulder/fotos}
boulder.logs.directorio=${BOULDER_LOGS:/var/log/boulder}

logging.level.root=INFO
logging.level.org.hibernate.SQL=WARN
